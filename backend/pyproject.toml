[project]
name = "cao-backend"
version = "0.1.0"
description = "API e servidor de partidas do Caô!"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "python-socketio>=5.11,<6",
  "uvicorn>=0.34",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cao_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
